name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        racket-version: ['8.7', '9.2']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Racket
        uses: Bogdanp/setup-racket@v1.12
        with:
          architecture: x64
          distribution: full
          version: ${{ matrix.racket-version }}

      - name: Install package
        run: raco pkg install --auto
        working-directory: ${{ github.workspace }}

      - name: Run tests
        run: raco test .

      - name: Check compilation
        run: |
          raco make cli/lint.rkt
          raco make core/engine.rkt
          raco make core/rule.rkt
          raco make core/diagnostic.rkt

      - name: Lint self
        run: racket cli/lint.rkt . || true
        continue-on-error: true

  docs:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Racket
        uses: Bogdanp/setup-racket@v1.12
        with:
          architecture: x64
          distribution: full
          version: '9.2'

      - name: Install package
        run: raco pkg install --auto
        working-directory: ${{ github.workspace }}

      - name: Build cross-reference database
        run: raco setup --doc-index

      - name: Build documentation
        run: |
          mkdir -p _site
          raco scribble ++main-xref-in --html --dest _site scribblings/racket-linter.scrbl
          cp _site/racket-linter.html _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
